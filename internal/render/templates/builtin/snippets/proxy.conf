# Generated. Request headers for Apache in proxy and hybrid mode (M-6).
#
# proxy_set_header is inherited only when the current level defines none
# (https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header),
# so this file is included inside every location that proxies, and a
# location that adds its own header must include it as well.
#
# Host: the default is $proxy_host, the backend address; Apache needs the
# requested name to pick the virtual host.
proxy_set_header Host $host;
# The visitor address for Apache and its logs. $proxy_add_x_forwarded_for
# appends $remote_addr to the X-Forwarded-For sent by the client, so only its
# last element was added by nginx; Apache must trust only that one (for
# example mod_remoteip with nginx as the internal proxy).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx is the only proxy in front of Apache, so it owns every forwarding
# header: the ones it knows are set from its own values, the others are
# removed (an empty value removes a header) so that a visitor cannot spoof
# them to applications that trust them.
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header Forwarded "";
# HTTP/1.1 with the Upgrade handshake passed on, so WebSocket connections
# work (https://nginx.org/en/docs/http/websocket.html); $connection_upgrade
# is defined by a map in the main file.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Do not pass a client "Proxy" header on to CGI programs as HTTP_PROXY
# (the "httpoxy" issue): an empty value removes the header.
proxy_set_header Proxy "";
