name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      # The apply and render integration tests run the real nginx. The
      # render templates need nginx 1.25.1+ ("http2" directive) and HTTP/3,
      # which Ubuntu 24.04's nginx 1.24 lacks, so nginx comes from the
      # nginx.org stable repository, set up as described on
      # https://nginx.org/en/linux_packages.html#Ubuntu (key fingerprint
      # checked against the one published there).
      - name: Install nginx
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://nginx.org/keys/nginx_signing.key -o "$RUNNER_TEMP/nginx_signing.key"
          gpg --show-keys --with-colons "$RUNNER_TEMP/nginx_signing.key" \
            | grep -q '^fpr:::::::::573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62:$'
          gpg --dearmor < "$RUNNER_TEMP/nginx_signing.key" \
            | sudo tee /usr/share/keyrings/nginx-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list
          # Prefer nginx.org packages over Ubuntu's, as linux_packages.html
          # suggests.
          printf 'Package: *\nPin: origin nginx.org\nPin: release o=nginx\nPin-Priority: 900\n' \
            | sudo tee /etc/apt/preferences.d/99nginx
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nginx
          /usr/sbin/nginx -V
      - name: Test
        env:
          NGINX_TEST_REQUIRED: "1"
          NGINX_TEST_REQUIRE_HTTP3: "1"
          NGINX_TEST_BINARY: /usr/sbin/nginx
        run: go test -race -count=1 ./...
      # The symbolic link ownership checks of the live render test (Q-6)
      # need root to give files another owner.
      - name: Render live test as root
        env:
          NGINX_TEST_REQUIRED: "1"
          NGINX_TEST_REQUIRE_HTTP3: "1"
          NGINX_TEST_BINARY: /usr/sbin/nginx
        run: |
          go test -c -o "$RUNNER_TEMP/render.test" ./internal/render
          cd internal/render
          sudo -E "$RUNNER_TEMP/render.test" -test.run 'TestIntegrationLive' -test.v 2>&1 | tee "$RUNNER_TEMP/live.log"
          ! grep -q 'ownership check skipped' "$RUNNER_TEMP/live.log"
      - name: Build for Linux x86_64
        run: make build-linux

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
